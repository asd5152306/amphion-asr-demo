<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" fill="none" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">AmphionASR architecture</title>
  <desc id="archDesc">Audio encoder, optional enrollment, hotword retrieval, and a 1.7B LLM decode a transcription from a shared prefix.</desc>
  <defs>
    <linearGradient id="gCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f4eee3"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1.2 L8 5 L0 8.8" fill="none" stroke="#1c1915" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1099" height="459" rx="22" fill="#f7f1e6" stroke="#d8cfbe"/>

  <!-- Instruction -->
  <g>
    <rect x="36" y="36" width="170" height="64" rx="12" fill="url(#gCard)" stroke="#cfc6b4"/>
    <text x="121" y="62" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#1c1915">Instruction</text>
    <text x="121" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6458">task prompt</text>
  </g>

  <!-- Input speech -->
  <g>
    <rect x="36" y="128" width="170" height="64" rx="12" fill="url(#gCard)" stroke="#cfc6b4"/>
    <text x="121" y="154" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#1c1915">Input speech</text>
    <text x="121" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6458">16 kHz waveform</text>
  </g>

  <!-- Enrollment -->
  <g>
    <rect x="36" y="220" width="170" height="64" rx="12" fill="#fffaf2" stroke="#c45c26" stroke-dasharray="4 3"/>
    <text x="121" y="246" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#1c1915">Enrollment</text>
    <text x="121" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8a4a2a">optional · 35 s</text>
  </g>

  <!-- Hotword DB -->
  <g>
    <rect x="36" y="332" width="170" height="64" rx="12" fill="#fffaf2" stroke="#0d6e63" stroke-dasharray="4 3"/>
    <text x="121" y="358" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-size="13" fill="#1c1915">Hotword pool</text>
    <text x="121" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0d6e63">~10k / language</text>
  </g>

  <!-- Tokenizer -->
  <g>
    <rect x="268" y="36" width="168" height="64" rx="12" fill="url(#gCard)" stroke="#cfc6b4"/>
    <text x="352" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c1915">Text tokenizer</text>
    <text x="352" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6458">instruction tokens</text>
  </g>

  <!-- Audio encoder -->
  <g>
    <rect x="268" y="128" width="168" height="156" rx="14" fill="#16130f"/>
    <text x="352" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#f7f1e6">Audio encoder</text>
    <text x="352" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbbba6">300M AuT · 12.5 Hz</text>
    <text x="352" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8d8376">shared for both clips</text>
  </g>

  <!-- Retriever -->
  <g>
    <rect x="268" y="332" width="168" height="64" rx="12" fill="#0d6e63"/>
    <text x="352" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f7f1e6">Fine-grained RAG</text>
    <text x="352" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d7efe9">frame max · top-K=50</text>
  </g>

  <!-- Prefix merge -->
  <g>
    <rect x="516" y="156" width="150" height="100" rx="14" fill="url(#gCard)" stroke="#cfc6b4"/>
    <text x="591" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1c1915">Shared prefix</text>
    <text x="591" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b6458">tokens + embeddings</text>
  </g>

  <!-- LLM -->
  <g>
    <rect x="736" y="128" width="168" height="156" rx="14" fill="#16130f"/>
    <text x="820" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f7f1e6">LLM 1.7B</text>
    <text x="820" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbbba6">Qwen3-ASR backbone</text>
    <text x="820" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8d8376">autoregressive decode</text>
  </g>

  <!-- Output -->
  <g>
    <rect x="956" y="156" width="108" height="100" rx="14" fill="#c45c26"/>
    <text x="1010" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fffaf2">Transcript</text>
    <text x="1010" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f3d7c6">requested speech</text>
  </g>

  <!-- arrows -->
  <line x1="206" y1="68" x2="262" y2="68" stroke="#1c1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="206" y1="160" x2="262" y2="160" stroke="#1c1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="206" y1="252" x2="262" y2="252" stroke="#c45c26" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="206" y1="364" x2="262" y2="364" stroke="#0d6e63" stroke-width="1.4" marker-end="url(#arrow)"/>

  <line x1="436" y1="68" x2="591" y2="150" stroke="#1c1915" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="436" y1="206" x2="510" y2="206" stroke="#1c1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="436" y1="364" x2="591" y2="262" stroke="#0d6e63" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="666" y1="206" x2="730" y2="206" stroke="#1c1915" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="904" y1="206" x2="950" y2="206" stroke="#1c1915" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="550" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#6b6458">Dashed boxes are optional at inference. Encoder is updated in Stage 1 only; retrieval adapters are 2.6M.</text>
</svg>
